route:
  # Grouping by 'job' ensures that if multiple containers fail, 
  # they are handled as separate remediation tasks.
  group_by: ['alertname', 'job']
  group_wait: 5s
  group_interval: 5s
  repeat_interval: 1h
  
  # Default receiver if no specific route matches
  receiver: 'webhook-healer'

  routes:
    # ROUTE 1: The Automated Healer
    # This only triggers the restart command.
    - match:
        severity: automated-remediation
      receiver: 'webhook-healer'
      repeat_interval: 10m  # Throttles restarts to once every 10 mins


    - match:
        severity: critical
      receiver: 'critical-notification'

receivers:
  - name: 'webhook-healer'
    webhook_configs:
      - url: 'http://webhook:9000/hooks/auto-restart'
        send_resolved: false

  - name: 'critical-notification'
    webhook_configs:
      - url: 'http://webhook:9000/hooks/log-critical-alert'